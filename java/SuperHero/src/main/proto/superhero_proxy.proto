syntax = "proto3";

package com.superhero.proxy.v1;

option java_multiple_files = true;
option java_package = "com.superhero.proxy.v1";
option java_outer_classname = "SuperHeroProxyProto";

service SuperHeroProxy {
  rpc SearchHeroes(SearchRequest) returns (SearchResponse);
}

message SearchRequest {
  string name = 1;
  string token = 2; // SuperHero API access token
}

message SearchResponse {
  string response = 1;        // "success" | "error"
  string results_for = 2;     // mirrors "results-for"
  repeated Hero results = 3;  // present when response == "success"
  string error = 4;           // present when response == "error"
}

message Hero {
  string id = 1;
  string name = 2;
  Powerstats powerstats = 3;
  Biography biography = 4;
  Appearance appearance = 5;
  Work work = 6;
  Connections connections = 7;
  Image image = 8;
}

message Powerstats {
  string intelligence = 1;
  string strength = 2;
  string speed = 3;
  string durability = 4;
  string power = 5;
  string combat = 6;
}

message Biography {
  string full_name = 1;       // "full-name"
  string alter_egos = 2;      // "alter-egos"
  repeated string aliases = 3;
  string place_of_birth = 4;  // "place-of-birth"
  string first_appearance = 5;// "first-appearance"
  string publisher = 6;
  string alignment = 7;
}

message Appearance {
  string gender = 1;
  string race = 2;
  repeated string height = 3;
  repeated string weight = 4;
  string eye_color = 5;       // "eye-color"
  string hair_color = 6;      // "hair-color"
}

message Work {
  string occupation = 1;
  string base = 2;
}

message Connections {
  string group_affiliation = 1; // "group-affiliation"
  string relatives = 2;
}

message Image {
  string url = 1;
}


